# 单机部署：backend（FastAPI）+ web（Nginx 静态资源 + API 反向代理）
# 首次启动时 backend 会自动执行 SQLite schema 迁移；data/ 以 bind mount 挂载，重启不丢数据。

services:
  backend:
    build:
      context: ./backend
    image: campus-ai-tools-backend:latest
    container_name: campus-ai-backend
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      JWT_SECRET: ${JWT_SECRET:-dev-insecure-secret-change-me-0123456789}
      JWT_EXPIRE_DAYS: ${JWT_EXPIRE_DAYS:-7}
      LLM_PROVIDER: ${LLM_PROVIDER:-deepseek}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      DEEPSEEK_EMBEDDING_MODEL: ${DEEPSEEK_EMBEDDING_MODEL:-deepseek-embedding}
      DATA_DIR: /app/data
      DB_PATH: /app/data/app.db
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      DAILY_QA_LIMIT: ${DAILY_QA_LIMIT:-30}
      DAILY_CHAT_LIMIT: ${DAILY_CHAT_LIMIT:-50}
    volumes:
      - ./data:/app/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build:
      context: ./web
    image: campus-ai-tools-web:latest
    container_name: campus-ai-web
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
