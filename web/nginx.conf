server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 与技术方案 §3.4 的 30MB 上传上限保持一致（nginx 默认仅 1MB）
    client_max_body_size 30m;

    # 上传超限时返回统一 JSON 错误体，而不是 nginx 默认的 HTML 页面
    error_page 413 = @payload_too_large;
    location @payload_too_large {
        default_type application/json;
        return 413 '{"code":"DOCUMENT_TOO_LARGE","message":"上传内容超过 30MB 上限，请压缩后重试。"}';
    }

    # 后端接口反向代理
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # 健康探针透传，便于单机部署验收
    location = /healthz {
        proxy_pass http://backend:8000/healthz;
        proxy_set_header Host $host;
    }

    # 前端为单页应用，未知路径回落到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
}
